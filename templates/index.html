<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no">
<title>Lights</title>
<style>
:root {
  --bg: #f3f1ec;
  --card: #ffffff;
  --text: #24221f;
  --muted: #77736b;
  --line: #dedad2;
  --on: #f6b73c;
  --on-bg: #fff4dc;
  --gray-bg: #dcd9d3;
  --gray-text: #8d8981;
  --danger: #c2412d;
  --night: #3f4f8f;
  --night-bg: #e6e9f6;
  --shadow: 0 1px 2px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161514;
    --card: #23211f;
    --text: #ece9e3;
    --muted: #9a958c;
    --line: #34312d;
    --on: #f6b73c;
    --on-bg: #3a2f17;
    --gray-bg: #2c2a28;
    --gray-text: #6f6b64;
    --danger: #e0644f;
    --night: #9fb0f0;
    --night-bg: #262c45;
    --shadow: none;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  touch-action: manipulation;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.autodim {
  color: var(--muted);
  font-size: 14px;
}

h1 {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 22px 0 10px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
  gap: 10px;
}

div.button {
  -webkit-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
}

.light {
  position: relative;
  min-height: 84px;
  padding: 12px 12px 10px;
  border-radius: 14px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: background-color 0.15s, border-color 0.15s, transform 0.05s;
}
.light:active { transform: scale(0.97); }
.light .name { font-size: 17px; font-weight: 500; }
.light .level { font-size: 13px; color: var(--muted); min-height: 1em; }
.light .dot {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--line);
}
.light[data-state="on"] { background: var(--on-bg); border-color: var(--on); }
.light[data-state="on"] .dot { background: var(--on); box-shadow: 0 0 8px var(--on); }
.light[data-state="off"] .level { visibility: hidden; }
/* not reported yet, or offline: clearly gray, not a white "off" tile */
.light[data-state="pending"],
.light[data-state="offline"] {
  background: var(--gray-bg);
  border-color: var(--gray-bg);
  box-shadow: none;
  color: var(--gray-text);
}
.light[data-state="pending"] .dot,
.light[data-state="offline"] .dot { background: var(--gray-text); }
.light[data-state="pending"] .level,
.light[data-state="offline"] .level { visibility: visible; color: var(--gray-text); }

.alloff {
  padding: 12px 20px;
  border-radius: 999px;
  border: 1px solid var(--danger);
  color: var(--danger);
  background: var(--card);
  font-weight: 600;
}
.alloff:active { background: var(--danger); color: #fff; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.night {
  padding: 12px 20px;
  border-radius: 999px;
  border: 1px solid var(--night);
  color: var(--night);
  background: var(--card);
  font-weight: 600;
}
.night[data-on="true"] { background: var(--night); color: var(--card); }

.modal {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: min(380px, calc(100% - 32px));
  margin-top: 16px;
  padding: 18px;
  background: var(--card);
  color: var(--text);
  border-radius: 18px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  z-index: 2;
}
.modal h3 { margin: 0 0 14px; font-size: 17px; font-weight: 600; padding-right: 36px; }
.modal .levels {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.modal .levels div.button {
  padding: 14px 0;
  text-align: center;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg);
  font-weight: 500;
}
.modal .levels div.button:active { background: var(--on-bg); border-color: var(--on); }
.btn-close {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 32px;
  height: 32px;
  border: 0;
  border-radius: 50%;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
}
.btn {
  width: 100%;
  margin-top: 14px;
  padding: 12px;
  border: 0;
  border-radius: 10px;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 1;
}
.hidden { display: none; }
.stop-scrolling { height: 100%; overflow: hidden; }
</style>
<script>

var longpress = false;

// Brightness is 0..254 on the wire; the UI shows percent.
function to_percent(b) {
	return Math.round(b * 100 / 254) + "%";
}

function sendJSON(json_object) {
	let xhr = new XMLHttpRequest();
	xhr.open("POST", "/set-state", true);
	xhr.setRequestHeader("Content-Type", "application/json");
	xhr.send(JSON.stringify(json_object));
}

function send_all_off(json_object) {
	let xhr = new XMLHttpRequest();
	xhr.open("POST", "/set-all-off", true);
	xhr.setRequestHeader("Content-Type", "application/json");
	xhr.send(JSON.stringify(json_object));
}

function request_state_updates(json_object){
	let xhr = new XMLHttpRequest();
	xhr.open("POST", "/get-state", true);
	xhr.setRequestHeader("Content-Type", "application/json");
	xhr.onreadystatechange = function () {
		if (xhr.readyState === 4 && xhr.status === 200) {
			const obj = JSON.parse(this.responseText);
			obj.devices.forEach(function (item) {
				let elt = document.getElementById(item.html_id);
				if (elt) {
					try {
						const payload = item.last_payload ? JSON.parse(item.last_payload) : {};
						let elt_in = document.getElementById(item.html_id + "_inner");
						if (!item.available) {
							elt.dataset.state = "offline";
							if (elt_in) { elt_in.textContent = "offline"; }
							return;
						}
						if (elt_in && payload.brightness !== undefined) {
							elt_in.textContent = to_percent(payload.brightness);
						} else if (elt_in && !item.last_payload) {
							elt_in.textContent = "no report";
						}
						if (item.last_payload_update.secs_since_epoch >= item.last_req_sent.secs_since_epoch) {
							if (payload.state == "ON") {
								elt.dataset.state = "on";
							} else if (payload.state == "OFF") {
								elt.dataset.state = "off";
							}
						} else {
							elt.dataset.state = "pending";
						}
					} catch (e) {
						console.log("AYERROR " + e);
					}
				}
			});
			show_night_mode(obj.night_mode);
			setTimeout(request_state_updates, 300, { last_update: obj.last_update });
		} else if (xhr.readyState === 4) {
			setTimeout(request_state_updates, 3000);
		}
	};
	xhr.onerror = function() {
		console.log("ERROR XHR");
	}
	xhr.send(JSON.stringify(json_object));
}

function show_night_mode(on) {
	let btn = document.getElementById("night_mode");
	btn.dataset.on = on ? "true" : "false";
	btn.textContent = on ? "Night mode: on (tap to undo)" : "Night mode";
}

function toggle_night_mode(elt) {
	let on = elt.dataset.on != "true";
	let xhr = new XMLHttpRequest();
	xhr.open("POST", "/night-mode", true);
	xhr.setRequestHeader("Content-Type", "application/json");
	xhr.onreadystatechange = function () {
		if (xhr.readyState === 4 && xhr.status === 200) {
			show_night_mode(JSON.parse(this.responseText).night_mode);
		}
	};
	xhr.send(JSON.stringify({ on: on }));
}

function all_off(elt) {
	send_all_off({});
}

function set_brightness(value) {
	let friendly_name = document.getElementById("brightness_target").dataset.name;
	sendJSON({ name: friendly_name, update: JSON.stringify({ brightness: value }) });
}

function longclick(elt) {
	elt = elt.closest(".light");
	if (!elt) {
		return;
	}
	let friendly_name = elt.id.replaceAll("_", " ");
	let modal = document.querySelector(".modal");
	let overlay = document.querySelector(".overlay");
	modal.classList.remove("hidden");
	overlay.classList.remove("hidden");
	modal.style.top = window.scrollY + "px";
	document.body.classList.add("stop-scrolling");
	let target = document.getElementById("brightness_target");
	target.dataset.name = friendly_name;
	target.textContent = friendly_name.split(" - 0x")[0];
}

function closemodal() {
	document.querySelector(".modal").classList.add("hidden");
	document.querySelector(".overlay").classList.add("hidden");
	document.body.classList.remove("stop-scrolling");
}

function testclick(elt) {
	let friendly_name = elt.id.replaceAll("_", " ");
	console.debug("long press: " + longpress + " Friendly name: " + friendly_name);
	if (longpress) {
		return;
	}
	if (elt.dataset.state != "on") {
		sendJSON({ name: friendly_name, update: JSON.stringify({ state: "ON" }) });
	} else {
		sendJSON({ name: friendly_name, update: JSON.stringify({ state: "OFF" }) });
	}
}

var presstimer = null;

var cancel_func = function(e) {
	if (presstimer !== null) {
		clearTimeout(presstimer);
		presstimer = null;
	}
};

var click_func = function(e) {
	if (presstimer !== null) {
		clearTimeout(presstimer);
		presstimer = null;
	}
	if (longpress) {
		return false;
	}
};

var start_func = function(e) {
	if (e.type === "click" && e.button !== 0) {
		return;
	}
	longpress = false;
	if (presstimer === null) {
		presstimer = setTimeout(function() {
			longpress = true;
			longclick(e.target);
		}, 1000);
	}
	return false;
};

function add_long_press(node) {
	node.addEventListener("mousedown", start_func);
	node.addEventListener("touchstart", start_func);
	node.addEventListener("click", click_func);
	node.addEventListener("mouseout", cancel_func);
	node.addEventListener("touchend", cancel_func);
	node.addEventListener("touchleave", cancel_func);
	node.addEventListener("touchcancel", cancel_func);
}

function body_init() {
	// Only the light tiles open the brightness dialog on a long press.
	var nodes = document.querySelectorAll(".light");
	for (var i = 0; i < nodes.length; i++) {
		add_long_press(nodes[i]);
	}
	show_night_mode(document.getElementById("night_mode").dataset.on == "true");
	setTimeout(request_state_updates, 300);
}

</script>
</head>
<body onload="body_init()">
	<div class="topbar">
		<div class="actions">
			<div class="button alloff" id="all_off" onclick="all_off(this)">Turn all off</div>
			<div class="button night" id="night_mode" data-on="{{night_mode}}" onclick="toggle_night_mode(this)">Night mode</div>
		</div>
		<div class="autodim">{{autodim_status}}</div>
	</div>
	{{#each rooms as |room|}}
	<h1>{{@key}}</h1>
	<div class="grid">
		{{#each room.device_names as |devname|}}
		{{#with (lookup ../../devices devname) as |dev|}}
		<div class="button light" id="{{dev.html_id}}" data-state="pending" onclick="testclick(this)">
			<span class="dot"></span>
			<span class="name">{{dev.short_name}}</span>
			<span class="level" id="{{dev.html_id}}_inner"></span>
		</div>
		{{/with}}
		{{/each}}
	</div>
	{{/each}}

<section class="modal hidden">
	<button class="btn-close" onclick="closemodal()">⨉</button>
	<h3>Brightness: <span id="brightness_target"></span></h3>
	<div class="levels">
		<div class="button" onclick="set_brightness(1)">min</div>
		<div class="button" onclick="set_brightness(13)">5%</div>
		<div class="button" onclick="set_brightness(25)">10%</div>
		<div class="button" onclick="set_brightness(51)">20%</div>
		<div class="button" onclick="set_brightness(76)">30%</div>
		<div class="button" onclick="set_brightness(127)">50%</div>
		<div class="button" onclick="set_brightness(191)">75%</div>
		<div class="button" onclick="set_brightness(254)">100%</div>
	</div>
	<button class="btn" onclick="closemodal()">Close</button>
</section>

<div class="overlay hidden" onclick="closemodal()"></div>
</body>
</html>
